<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2 API 受入試験</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:32px auto;padding:0 18px;line-height:1.6}input,button{font:inherit;width:100%;box-sizing:border-box;padding:12px;margin:6px 0}button{font-weight:700}pre{white-space:pre-wrap;word-break:break-word;background:#f3f3f3;padding:12px;border-radius:8px}.warn{font-weight:700}</style></head>
<body><h1>V2 API 受入試験</h1><p class="warn">テスト用Driveへ向いている時だけ実行してください。</p>
<label>Apps Script URL<input id="url" value="https://script.google.com/macros/s/AKfycbxlJ6mPx3AYpMM0MyfR0JYYRnQRJumb7JPAOEmTzfiMFpBgEuh_8GouGWG0UYE8CFE/exec"></label>
<label>V2同期トークン<input id="token" type="password" autocomplete="off" placeholder="スクリプトプロパティと同じ値"></label>
<button id="run">テストコピーで受入試験を実行</button><pre id="out">未実行</pre>
<script type="module">
import{runSafeApiAcceptance}from'./v2/api-acceptance.js';
const out=document.querySelector('#out'),btn=document.querySelector('#run');
btn.onclick=async()=>{const url=document.querySelector('#url').value.trim(),token=document.querySelector('#token').value;if(!url||!token)return out.textContent='URLとトークンが必要です';
if(!confirm('Apps Script の TV_V2_DATA_FILE_ID がテスト用ファイルになっていることを確認しましたか？'))return;
btn.disabled=true;out.textContent='実行中…';
try{const r=await runSafeApiAcceptance(url,token);out.textContent='成功\n'+JSON.stringify({beforeRevision:r.beforeRevision,afterRevision:r.afterRevision,mutationId:r.mutationId,counts:r.counts},null,2)}
catch(e){out.textContent='失敗（未完了）\n'+(e?.message||e)}finally{btn.disabled=false}};
</script></body></html>
