name: Normalize Edion Kashihara store aliases once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edion-store-alias-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add store alias normalization and current-lottery repair
        run: python .github/scripts/patch_edion_alias.py
      - run: npm test
      - run: npm run check
      - name: Commit alias repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add automation/RetailPricePolicy.gs
          git commit -m "Normalize Toreca Capital Edion Kashihara aliases"
          git push origin HEAD:main
