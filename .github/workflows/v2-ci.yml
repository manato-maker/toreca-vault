name: v2-ci
on:
  push:
    branches: [vault-v2-prep]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Verify staging operator fail-closed guards
        run: python3 -m unittest discover -s cloud/test -p test_staging_intake_operator.py -v
      - name: Check IAM bootstrap syntax and dry run
        run: bash -n cloud/scripts/bootstrap-staging-operator-wif.sh && bash cloud/scripts/bootstrap-staging-operator-wif.sh
