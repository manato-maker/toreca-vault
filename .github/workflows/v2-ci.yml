name: v2-ci
on:
  push:
    branches: [vault-v2-prep]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
  firestore-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix cloud
      - run: npm install --global firebase-tools@15.34.2
      - run: firebase emulators:exec --only firestore --project demo-toreca-vault --config cloud/firebase.json "npm run test:firestore-emulator --prefix cloud"
