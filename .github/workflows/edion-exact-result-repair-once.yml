name: Repair Edion confirmed win once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edion-exact-result-repair-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add confirmed Edion reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('automation/RetailPricePolicy.gs')
          s=p.read_text()
          handler=Path('tools/edion_confirmed_handler.js.txt').read_text().rstrip()+"\n"
          anchor="function tv2ProcessExactLotteryPatchDrafts_(){"
          if 'function tv2ProcessConfirmedEdionDrafts_()' not in s:
              if anchor not in s: raise SystemExit('exact patch anchor missing')
              s=s.replace(anchor,handler+anchor,1)
          old="function tv2EnforceRetailPricePolicy_(){\n const lotteryPatches=tv2ProcessExactLotteryPatchDrafts_();"
          new="function tv2EnforceRetailPricePolicy_(){\n const edionConfirmed=tv2ProcessConfirmedEdionDrafts_();\n const lotteryPatches=tv2ProcessExactLotteryPatchDrafts_();"
          if old in s: s=s.replace(old,new,1)
          old2="if(result&&typeof result==='object'){result.lotteryPatches=lotteryPatches;result.lotteryResults=lotteryResults;result.packOpenings=packOpenings}"
          new2="if(result&&typeof result==='object'){result.edionConfirmed=edionConfirmed;result.lotteryPatches=lotteryPatches;result.lotteryResults=lotteryResults;result.packOpenings=packOpenings}"
          if old2 in s: s=s.replace(old2,new2,1)
          if 'tv2ProcessConfirmedEdionDrafts_()' not in s or 'result.edionConfirmed=edionConfirmed' not in s:
              raise SystemExit('Edion handler patch failed')
          p.write_text(s)
          PY
      - run: npm test
      - run: npm run check
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add automation/RetailPricePolicy.gs
          git commit -m "Reconcile confirmed Edion lottery win"
          git push origin HEAD:main
