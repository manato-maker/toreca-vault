name: Repair exact lottery matching once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edion-exact-result-repair-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Allow unique exact match when canonical resultDate is blank
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('automation/RetailPricePolicy.gs')
          s=p.read_text()
          old="const dateMatch=String(item.resultDate||'').slice(0,10)===resultDate;"
          new="const existingResultDate=String(item.resultDate||'').slice(0,10),dateMatch=!existingResultDate||existingResultDate===resultDate;"
          count=s.count(old)
          if count!=2:
            raise SystemExit(f'expected 2 date-match anchors, got {count}')
          s=s.replace(old,new)
          old2="item.title=newTitle;\n    if(deadline)item.deadline=deadline;"
          new2="item.title=newTitle;\n    if(!String(item.resultDate||'').slice(0,10))item.resultDate=resultDate;\n    if(deadline)item.deadline=deadline;"
          if s.count(old2)!=1:
            raise SystemExit('patch resultDate anchor mismatch')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - run: npm test
      - run: npm run check
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add automation/RetailPricePolicy.gs
          git commit -m "Allow exact lottery repair with missing result date"
          git push origin HEAD:main
