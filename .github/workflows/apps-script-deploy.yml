name: Apps Script Automation Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node --test test/*.test.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: v2-apps-script
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save @google/clasp
      - name: Configure clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          TV2_SCRIPT_ID: ${{ secrets.TV2_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$TV2_SCRIPT_ID"
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"."}' "$TV2_SCRIPT_ID" > automation/.clasp.json
      - name: Push automation source
        working-directory: automation
        run: npx clasp push --force
      - name: Create immutable version
        working-directory: automation
        run: npx clasp version "GitHub ${GITHUB_SHA}"
