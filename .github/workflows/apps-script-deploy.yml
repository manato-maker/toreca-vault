name: Apps Script Automation Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - '.github/workflows/apps-script-deploy.yml'
      - 'scripts/patch-cardrush-buyback.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node --test test/*.test.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: v2-apps-script
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save @google/clasp
      - name: Configure clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          TV2_SCRIPT_ID: ${{ secrets.TV2_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$TV2_SCRIPT_ID"
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":".apps-script-automation"}' "$TV2_SCRIPT_ID" > .clasp.json
      - name: Pull existing project and preserve API files
        run: |
          mkdir -p .apps-script-automation
          npx clasp pull
          test -s .apps-script-automation/Code.js -o -s .apps-script-automation/コード.js
          test -s .apps-script-automation/appsscript.json
          cp .apps-script-automation/appsscript.json /tmp/tv-manifest-before.json
          cp .apps-script-automation/Code.js /tmp/tv-code-before.js 2>/dev/null || cp .apps-script-automation/コード.js /tmp/tv-code-before.js
          grep -q 'function fetchCardrushRows_' /tmp/tv-code-before.js
          grep -q 'function findCardrushBuyback_' /tmp/tv-code-before.js
          if test -s .apps-script-automation/Code.js; then code_path=.apps-script-automation/Code.js; else code_path=.apps-script-automation/コード.js; fi
          node scripts/patch-cardrush-buyback.mjs "$code_path" automation/Code.gs
          cp "$code_path" /tmp/tv-code-expected.js
          cp automation/V2Automation.gs .apps-script-automation/V2Automation.js
      - name: Push only patched automation into existing project
        run: npx clasp push --force
      - name: Verify remote source
        run: |
          mv .apps-script-automation .apps-script-automation-before
          mkdir .apps-script-automation
          npx clasp pull
          cmp -s /tmp/tv-manifest-before.json .apps-script-automation/appsscript.json
          cmp -s /tmp/tv-code-expected.js .apps-script-automation/Code.js || cmp -s /tmp/tv-code-expected.js .apps-script-automation/コード.js
          cmp -s automation/V2Automation.gs .apps-script-automation/V2Automation.js
      - name: Prepare temporary finalizer version
        run: |
          id=$(npx clasp deployments | awk '$3=="@2" {print $2; exit}')
          test -n "$id"
          echo "$id" > /tmp/finalizer-id.txt
          npx clasp version "Temporary finalizer ${GITHUB_SHA}" | tee /tmp/finalizer-version.out
          sed -n 's/.*Created version \([0-9][0-9]*\).*/\1/p' /tmp/finalizer-version.out | tail -n1 > /tmp/finalizer-version.txt
          test -s /tmp/finalizer-version.txt
          npx clasp deploy -i "$id" -V "$(cat /tmp/finalizer-version.txt)" -d "Temporary finalizer"
      - name: Execute final V2 completion
        run: |
          id=$(cat /tmp/finalizer-id.txt)
          url="https://script.google.com/macros/s/$id/exec?action=__tv2_finalize_20260927"
          ok=0
          for n in 1 2 3 4 5 6; do
            code=$(curl -sS -L --max-time 120 -o /tmp/finalizer-body.json -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ] && jq -e '.ok == true' /tmp/finalizer-body.json >/dev/null 2>&1; then ok=1; break; fi
            sleep 5
          done
          echo "FINALIZER_RESULT=$(cat /tmp/finalizer-body.json)"
          test "$ok" = "1"
      - name: Restore temporary deployment
        if: always()
        run: |
          if test -s /tmp/finalizer-id.txt; then npx clasp deploy -i "$(cat /tmp/finalizer-id.txt)" -V 2 -d "Restored version 2" || true; fi
      - name: Create immutable version
        working-directory: automation
        run: npx clasp version "GitHub ${GITHUB_SHA}"
