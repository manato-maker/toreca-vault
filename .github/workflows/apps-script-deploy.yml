name: Apps Script Automation Deploy
concurrency:
  group: toreca-vault-automation-apps-script
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - '.github/workflows/apps-script-deploy.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node --test test/*.test.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: v2-apps-script
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save @google/clasp
      - name: Configure clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          TV2_SCRIPT_ID: ${{ secrets.TV2_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$TV2_SCRIPT_ID"
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":".apps-script-automation"}' "$TV2_SCRIPT_ID" > .clasp.json
      - name: Build canonical Apps Script project
        run: |
          rm -rf .apps-script-automation
          mkdir -p .apps-script-automation
          cp automation/appsscript.json .apps-script-automation/appsscript.json
          cp automation/Code.gs .apps-script-automation/Code.js
          cp automation/V2Automation.gs .apps-script-automation/V2Automation.js
          cp automation/RetailPricePolicy.gs .apps-script-automation/RetailPricePolicy.js
      - name: Push canonical source
        run: npx clasp push --force
      - name: Verify remote source
        run: |
          rm -rf .apps-script-automation
          mkdir -p .apps-script-automation
          npx clasp pull
          cmp -s automation/appsscript.json .apps-script-automation/appsscript.json
          cmp -s automation/Code.gs .apps-script-automation/Code.js
          cmp -s automation/V2Automation.gs .apps-script-automation/V2Automation.js
          cmp -s automation/RetailPricePolicy.gs .apps-script-automation/RetailPricePolicy.js
      - name: Deploy the private Apps Script API executable
        env:
          TV2_API_DEPLOYMENT_DESCRIPTION: Toreca Vault V2 Automation API Executable
        run: |
          npx clasp list-deployments --json > /tmp/tv2-deployments-before.json
          node <<'NODE'
          const fs = require('node:fs');
          const deployments = JSON.parse(fs.readFileSync('/tmp/tv2-deployments-before.json', 'utf8'));
          const matches = deployments.filter(item => item.description === process.env.TV2_API_DEPLOYMENT_DESCRIPTION);
          if (matches.length > 1) throw new Error('duplicate private API executable deployments');
          fs.writeFileSync('/tmp/tv2-api-deployment-id', matches[0]?.deploymentId || '');
          NODE
          if [ -s /tmp/tv2-api-deployment-id ]; then
            npx clasp create-deployment --deploymentId "$(cat /tmp/tv2-api-deployment-id)" --description "$TV2_API_DEPLOYMENT_DESCRIPTION" >/dev/null
          else
            npx clasp create-deployment --description "$TV2_API_DEPLOYMENT_DESCRIPTION" >/dev/null
          fi
          npx clasp list-deployments --json > /tmp/tv2-deployments-after.json
          node <<'NODE'
          const fs = require('node:fs');
          const deployments = JSON.parse(fs.readFileSync('/tmp/tv2-deployments-after.json', 'utf8'));
          const matches = deployments.filter(item => item.description === process.env.TV2_API_DEPLOYMENT_DESCRIPTION);
          if (matches.length !== 1 || !matches[0].deploymentId) throw new Error('private API executable deployment verification failed');
          console.log('Private Apps Script API executable deployment verified.');
          NODE
