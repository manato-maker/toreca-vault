name: Temporary Single Market Diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-single-market-diagnostic.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Toretoku exact model variants
        shell: bash
        run: |
          python - <<'PY'
          import urllib.parse,urllib.request,re
          cards=[
            ('リザードン','M6a 137/103'),
            ('レアコイル','SV8 112/106'),
            ('メガリザードンex','M2a 223/193'),
            ('ニョロモ','SV2a 060/165'),
          ]
          def norm(s):
            return re.sub(r'[\s\u3000\-_・:：()（）【】\[\]「」『』]','',str(s).casefold())
          pat=re.compile(r'\\\"name\\\":\\\"([^\\\"]+)\\\".*?\\\"price\\\":(\d+).*?\\\"modelNumber\\\":\\\"([^\\\"]+)\\\".*?\\\"rarity\\\":\\\"([^\\\"]*)\\\"',re.S)
          for wanted,settext in cards:
            print('\n===',wanted,settext,'===')
            for q in [wanted,settext,settext.split()[-1],wanted+' '+settext]:
              url='https://www.toretoku.jp/kaitori/pokemon/item-search?'+urllib.parse.urlencode({'genre':'pokemon','keyword':q})
              try:
                txt=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read().decode('utf-8','replace')
                allrows=[]
                for m in pat.finditer(txt):
                  n,price,model,rarity=m.groups()
                  if norm(settext.split()[-1]) in norm(model):
                    allrows.append((n,int(price),model,rarity))
                print('QUERY',q,'MODEL_HITS',len(allrows),allrows[:20])
              except Exception as e: print('ERR',q,repr(e))
          PY
