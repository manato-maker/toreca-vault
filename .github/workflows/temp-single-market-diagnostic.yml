name: Temporary Single Market Diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-single-market-diagnostic.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect strict Toretoku objects by model
        shell: bash
        run: |
          python - <<'PY'
          import urllib.parse,urllib.request,re
          cards=[('リザードン','M6a 137/103'),('レアコイル','SV8 112/106'),('メガリザードンex','M2a 223/193'),('ニョロモ','SV2a 060/165')]
          pat=re.compile(r'\{\\\"name\\\":\\\"([^\\\"]+)\\\",\\\"itemCode\\\":\\\"[^\\\"]+\\\",\\\"price\\\":(\d+),\\\"sellPrice\\\":\d+,\\\"modelNumber\\\":\\\"([^\\\"]+)\\\",\\\"imageUrl\\\":\\\"[^\\\"]+\\\",\\\"rarity\\\":\\\"([^\\\"]*)\\\"\}')
          for wanted,settext in cards:
            q=settext.split()[-1]
            url='https://www.toretoku.jp/kaitori/pokemon/item-search?'+urllib.parse.urlencode({'genre':'pokemon','keyword':q})
            txt=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read().decode('utf-8','replace')
            rows=[m.groups() for m in pat.finditer(txt) if m.group(3)==settext]
            print(wanted,settext,rows[:20])
          PY
