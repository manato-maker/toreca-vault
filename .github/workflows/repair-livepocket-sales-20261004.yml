name: Repair LivePocket and Sales 20261004
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-livepocket-sales-20261004.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    environment: v2-apps-script
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Make repair queue-safe and date-scope historical reconciliation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('automation/V2Automation.gs')
          s=p.read_text()
          s=s.replace("function runTv2RepairCurrent20261004(){\n const requests={", "function runTv2RepairCurrent20261004(options){\n const fromQueue=Boolean(options&&options.fromQueue);\n const requests={", 1)
          s=s.replace(" const schedule=installTv2Automation();\n const gmail=runTv2LotteryAuto({skipScheduleEnsure:true});", " const schedule=fromQueue?tv2AutomationStatus():installTv2Automation();\n const gmail=fromQueue?{skipped:true,reason:'queue-repair'}:runTv2LotteryAuto({skipScheduleEnsure:true});", 1)
          old="if(!['sale','purchase','lottery','lottery-bulk','repair-receipt-sale','pokemoncenter-spouse-result','card-market-lookup','market-refresh-cards','reconcile-results-20260930','dedupe-beehonpo-20260930'].includes(type))throw new Error('Toreca Vaultコマンド種別が不正です');"
          new="if(!['sale','purchase','lottery','lottery-bulk','repair-receipt-sale','pokemoncenter-spouse-result','card-market-lookup','market-refresh-cards','reconcile-results-20260930','dedupe-beehonpo-20260930','repair-current-20261004'].includes(type))throw new Error('Toreca Vaultコマンド種別が不正です');"
          if old not in s and new not in s: raise SystemExit('command type anchor missing')
          s=s.replace(old,new,1)
          old_dispatch="const result=type==='sale'?runTv2ChatSale(command):type==='purchase'?runTv2ChatPurchase(command):type==='lottery'?runTv2ChatLottery(command):type==='lottery-bulk'?runTv2ChatLotteryBulk(command):type==='pokemoncenter-spouse-result'?runTv2PokemonCenterSpouseResult(command):type==='card-market-lookup'?runTv2ChatCardMarketLookup(command):type==='market-refresh-cards'?runTv2ChatMarketRefresh(command):type==='reconcile-results-20260930'?runTv2ReconcileResults20260930(command):type==='dedupe-beehonpo-20260930'?runTv2DedupeBeeHonpo20260930(command):runTv2RepairReceiptSale(command);"
          new_dispatch="const result=type==='sale'?runTv2ChatSale(command):type==='purchase'?runTv2ChatPurchase(command):type==='lottery'?runTv2ChatLottery(command):type==='lottery-bulk'?runTv2ChatLotteryBulk(command):type==='pokemoncenter-spouse-result'?runTv2PokemonCenterSpouseResult(command):type==='card-market-lookup'?runTv2ChatCardMarketLookup(command):type==='market-refresh-cards'?runTv2ChatMarketRefresh(command):type==='reconcile-results-20260930'?runTv2ReconcileResults20260930(command):type==='dedupe-beehonpo-20260930'?runTv2DedupeBeeHonpo20260930(command):type==='repair-current-20261004'?runTv2RepairCurrent20261004({fromQueue:true}):runTv2RepairReceiptSale(command);"
          if old_dispatch not in s and new_dispatch not in s: raise SystemExit('dispatch anchor missing')
          s=s.replace(old_dispatch,new_dispatch,1)
          old_set9="const set9All=(state.lotteries||[]).filter(x=>isPc(x)&&isSet9(x));"
          new_set9="const set9All=(state.lotteries||[]).filter(x=>{if(!isPc(x)||!isSet9(x))return false;const d=String(x.resultDate||'').slice(0,10),r=String(x.requestId||'');return d===resultDate||/20260930/.test(r)||(!d&&['応募済','応募済み'].includes(String(x.status||'')));});"
          if old_set9 not in s and new_set9 not in s: raise SystemExit('set9 anchor missing')
          s=s.replace(old_set9,new_set9,1)
          p.write_text(s)
          PY
      - name: Run regression tests
        run: node --test test/*.test.js
      - name: Commit source patch
        run: |
          git config user.name 'manato-maker'
          git config user.email 'manato.pt@gmail.com'
          git add automation/V2Automation.gs
          git commit -m 'Queue verified repair and protect historical 9-card records' || true
          git push origin main
      - run: npm install --no-save @google/clasp
      - name: Configure clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          TV2_SCRIPT_ID: ${{ secrets.TV2_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$TV2_SCRIPT_ID"
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":".apps-script-automation"}' "$TV2_SCRIPT_ID" > .clasp.json
      - name: Push Apps Script
        run: |
          rm -rf .apps-script-automation
          mkdir -p .apps-script-automation
          cp automation/appsscript.json .apps-script-automation/appsscript.json
          cp automation/Code.gs .apps-script-automation/Code.js
          cp automation/V2Automation.gs .apps-script-automation/V2Automation.js
          npx clasp push --force
