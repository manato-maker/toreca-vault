name: Run V2 asset reconciliation once
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Apps Script Automation Deploy]
    types: [completed]
    branches: [main]
jobs:
  run:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: v2-apps-script
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save @google/clasp
      - name: Configure clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          TV2_SCRIPT_ID: ${{ secrets.TV2_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$TV2_SCRIPT_ID"
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s"}' "$TV2_SCRIPT_ID" > .clasp.json
      - name: Run a scoped read-only audit, then reconciliation
        shell: bash
        run: |
          for function in runTv2AssetAuditOnce runTv2AssetReconcileOnce; do
            set +e
            output="$(npx clasp run "$function" 2>&1)"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "Apps Script invocation failed; response suppressed to protect private data."
              exit "$status"
            fi
            if printf '%s' "$output" | grep -Eiq 'unable to run script function|permission_denied|authorization is required|error|failed|exception|denied|"ok"[[:space:]]*:[[:space:]]*false'; then
              echo "Scoped Apps Script runner reported failure; details remain in private Gmail drafts."
              exit 1
            fi
          done
          echo "Scoped Apps Script audit/reconciliation runners returned successfully; response details suppressed."
