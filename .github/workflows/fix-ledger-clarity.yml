name: Fix ledger clarity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ledger-clarity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch ledger UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path=Path('js/app.js')
          s=path.read_text()

          marker="function transactionUnitPriceText(x){const n=Number(x?.quantity),p=Number(x?.price);return Number.isFinite(n)&&n>1&&Number.isFinite(p)&&p>0?'単価 '+yen.format(p):''}\n"
          helpers="""function transactionUnitPriceText(x){const n=Number(x?.quantity),p=Number(x?.price);return Number.isFinite(n)&&n>1&&Number.isFinite(p)&&p>0?'単価 '+yen.format(p):''}\nfunction transactionConditionText(x){const raw=String(x?.condition||'').trim(),idText=String(x?.id||x?.requestId||'').toLowerCase(),memo=String(x?.memo||'').normalize('NFKC');if(/shrink[-_ ]?yes/.test(idText)||/シュリンクあり/.test(memo))return'シュリンクあり';if(/shrink[-_ ]?no/.test(idText)||/シュリンクなし/.test(memo))return'シュリンクなし';if(/tape/.test(idText)||/テープ付き|テープあり/.test(memo))return'テープ付き';if(!raw||['未選択','対象外'].includes(raw))return'';if(raw==='あり'&&String(x?.category||'')==='BOX')return'シュリンクあり';if(raw==='なし'&&String(x?.category||'')==='BOX')return'シュリンクなし';return raw}\nfunction saleCostStatusText(x){if(x?._kind!=='売却')return'';if(x.acquisitionCost==null)return'原価未確定（損益・回収率から除外）';const cost=Number(x.acquisitionCost)||0,profit=saleRevenue(x)-cost;return`原価 ${yen.format(cost)} · 損益 ${profit>=0?'+':''}${yen.format(profit)}`}\n"""
          if 'function transactionConditionText(x)' not in s:
              if marker not in s: raise SystemExit('transaction helper marker not found')
              s=s.replace(marker,helpers,1)

          ledger="""function ledger(){const months=[...new Set([...state.purchases,...state.sales].map(x=>(x.date||'').slice(0,7)).filter(Boolean))].sort().reverse(),month=subtype?.match(/^\\d{4}-\\d{2}$/)?subtype:months[0]||today().slice(0,7),p=state.purchases.filter(x=>(x.date||'').startsWith(month)),s=state.sales.filter(x=>(x.date||'').startsWith(month)),spent=p.reduce((n,x)=>n+(+x.total||(+x.price||0)*(+x.quantity||1)),0),revenue=s.reduce((n,x)=>n+saleRevenue(x),0),settled=s.filter(x=>x.acquisitionCost!=null),pendingCost=s.length-settled.length,cost=settled.reduce((n,x)=>n+Number(x.acquisitionCost),0),settledRevenue=settled.reduce((n,x)=>n+saleRevenue(x),0),profit=settledRevenue-cost,recovery=cost?`${Math.round(settledRevenue/cost*100)}%`:'—',settledNames=settled.map(x=>x.product||'名称未設定').join('、'),profitBasis=settled.length?`${settledNames} ${settled.length}件の売却 ${yen.format(settledRevenue)} − 原価 ${yen.format(cost)}`:'原価確定済みの売却なし',pendingNote=pendingCost?`原価未確定 ${pendingCost}件は損益・回収率から除外`:'全売却の原価を確認済み',categories=['BOX','カード','パック','その他'].map(category=>{const cp=p.filter(x=>(x.category||'その他')===category),cs=s.filter(x=>(x.category||'その他')===category);return[category,cp.reduce((n,x)=>n+(+x.total||(+x.price||0)*(+x.quantity||1)),0),cs.reduce((n,x)=>n+saleRevenue(x),0)]}),rows=[...p.map(x=>({...x,_kind:'購入',_collection:'purchases'})),...s.map(x=>({...x,_kind:'売却',_collection:'sales'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||''));return`<div class=\"month-tabs\">${months.map(m=>`<button class=\"tab ${m===month?'active':''}\" data-month=\"${m}\">${m}</button>`).join('')}</div><div class=\"metric-grid\"><article class=\"metric-card\"><span class=\"label\">当月購入額</span><div class=\"metric-value\">${yen.format(spent)}</div><small>この月に購入した金額</small></article><article class=\"metric-card\"><span class=\"label\">当月売却額</span><div class=\"metric-value\">${yen.format(revenue)}</div><small>この月に売却した金額</small></article><article class=\"metric-card\"><span class=\"label\">実現損益（原価確定 ${settled.length}件）</span><div class=\"metric-value\">${profit>=0?'+':''}${yen.format(profit)}</div><small>${esc(profitBasis)}</small><small>${esc(pendingNote)}</small></article><article class=\"metric-card\"><span class=\"label\">回収率（原価確定 ${settled.length}件）</span><div class=\"metric-value\">${recovery}</div><small>${settled.length?`売却 ${yen.format(settledRevenue)} ÷ 原価 ${yen.format(cost)}`:'算定対象なし'}</small><small>${esc(pendingNote)}</small></article></div><section><div class=\"section-head\"><h2>種別内訳</h2></div><div class=\"panel finance-breakdown\">${categories.map(([c,buy,sale])=>`<div><b>${c}</b><span>購入 ${yen.format(buy)}</span><span>売却 ${yen.format(sale)}</span></div>`).join('')}</div></section>${rows.length?`<div class=\"list\">${rows.map(x=>`<article class=\"list-item txn-${transactionTone(x)}\"><div><h3>${esc(x.product||'名称未設定')}</h3><div class=\"list-meta\">${esc(x._kind)} · ${esc(x.store||'')}${x.date?` · ${esc(x.date)}`:''}${transactionQtyText(x)?` · <span class=\"transaction-qty\">${esc(transactionQtyText(x))}</span>`:''}${transactionConditionText(x)?` · <span class=\"transaction-condition\">${esc(transactionConditionText(x))}</span>`:''}</div>${saleCostStatusText(x)?`<div class=\"transaction-detail\">${esc(saleCostStatusText(x))}</div>`:''}</div><div><div class=\"amount\">${yen.format(x._kind==='売却'?saleRevenue(x):(+x.total||(+x.price||0)*(+x.quantity||1)))}</div>${transactionUnitPriceText(x)?`<div class=\"transaction-detail\">${esc(transactionUnitPriceText(x))}</div>`:''}${v2ReadOnly?'':`<button class=\"danger-link\" data-delete=\"${x._collection}\" data-id=\"${esc(x.id)}\">削除</button>`}</div></article>`).join('')}</div>`:empty('収支記録')}`}\n"""
          s,n=re.subn(r"function ledger\(\)\{.*?\nfunction activity\(\)\{",lambda m: ledger+"function activity(){",s,count=1,flags=re.S)
          if n!=1: raise SystemExit('ledger function replacement failed')

          activity="""function activity(){const all=[...state.purchases.map(x=>({...x,_kind:'購入'})),...state.sales.map(x=>({...x,_kind:'売却'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||''));return all.length?`<div class=\"list\">${all.map(x=>`<article class=\"list-item txn-${transactionTone(x)}\"><div><h3>${esc(x.product||x.title)}</h3><div class=\"list-meta\">${esc(x._kind)} · ${esc(x.store||'')}${x.date?` · ${esc(x.date)}`:''}${transactionQtyText(x)?` · <span class=\"transaction-qty\">${esc(transactionQtyText(x))}</span>`:''}${transactionConditionText(x)?` · <span class=\"transaction-condition\">${esc(transactionConditionText(x))}</span>`:''}</div>${saleCostStatusText(x)?`<div class=\"transaction-detail\">${esc(saleCostStatusText(x))}</div>`:''}</div><div><div class=\"amount\">${x.price?yen.format((+x.price||0)*(+x.quantity||1)):''}</div>${transactionUnitPriceText(x)?`<div class=\"transaction-detail\">${esc(transactionUnitPriceText(x))}</div>`:''}</div></article>`).join('')}</div>`:empty('履歴')}\n"""
          s,n=re.subn(r"function activity\(\)\{.*?\nfunction v2Connected\(\)\{",lambda m: activity+"function v2Connected(){",s,count=1,flags=re.S)
          if n!=1: raise SystemExit('activity function replacement failed')
          path.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text()
          t=t.replace("const CACHE='toreca-vault-v61';","const CACHE='toreca-vault-v62';")
          sw.write_text(t)

          test=Path('test/ledger-clarity-source.test.js')
          test.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\n\nconst source=fs.readFileSync(new URL('../js/app.js',import.meta.url),'utf8');\n\ntest('ledger explains monthly totals and cost basis',()=>{\n  assert.match(source,/当月購入額/);\n  assert.match(source,/当月売却額/);\n  assert.match(source,/原価未確定 .*損益・回収率から除外/);\n  assert.match(source,/売却 .* ÷ 原価/);\n});\n\ntest('sale rows display distinguishable condition and cost status',()=>{\n  assert.match(source,/function transactionConditionText/);\n  assert.match(source,/シュリンクあり/);\n  assert.match(source,/シュリンクなし/);\n  assert.match(source,/function saleCostStatusText/);\n  assert.match(source,/transaction-condition/);\n});\n""")
          PY
      - name: Test
        run: |
          npm test
          npm run check
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'manato-maker'
          git config user.email 'manato.pt@gmail.com'
          git add js/app.js sw.js test/ledger-clarity-source.test.js
          git commit -m 'Clarify ledger totals, sale conditions, and profit basis'
          git push
