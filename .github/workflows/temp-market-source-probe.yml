name: Temporary Market Source Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-market-source-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Altema exact buyback pages
        shell: bash
        run: |
          python - <<'PY'
          import urllib.parse,urllib.request,re,html
          cards=[('リザードン','137/103'),('コイキング','165/103'),('ブラッキーex','044/040'),('エーフィex','043/040')]
          UA={'User-Agent':'Mozilla/5.0'}
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=30) as r:
              return r.status,r.read().decode('utf-8','replace')
          for name,model in cards:
            print('\nCARD',name,model)
            try:
              url='https://altema.jp/pokemoncard/?s='+urllib.parse.quote(name+' '+model)
              st,txt=get(url)
              links=[]
              for x in re.findall(r'href=[\"\'](https://altema\.jp/pokemoncard/[^\"\'#?]+)',txt,re.I):
                if x not in links: links.append(x)
              print(' SEARCH',st,'links',links[:12])
              for u in links[:12]:
                try:
                  st2,t=get(u)
                  clean=html.unescape(re.sub(r'\s+',' ',re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>|<[^>]+>',' ',t,flags=re.I)))
                  if model not in clean or name not in clean: continue
                  print(' PAGE',u,'status',st2,'model_count',clean.count(model))
                  idx=clean.find(model); print('  SNIP',clean[max(0,idx-700):idx+1600])
                except Exception as e: print(' PAGE_ERR',u,repr(e))
            except Exception as e: print(' SEARCH_ERR',repr(e))
          PY
