name: Temporary Market Source Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-market-source-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Gamepedia generic card pages
        shell: bash
        run: |
          python - <<'PY'
          import urllib.parse,urllib.request,re,html
          cards=[('リザードン','137/103'),('コイキング','165/103'),('ブラッキーex','044/040'),('エーフィex','043/040')]
          UA={'User-Agent':'Mozilla/5.0'}
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=30) as r:
              return r.status,r.read().decode('utf-8','replace')
          for name,model in cards:
            url='https://premium.gamepedia.jp/pokeca/card/'+urllib.parse.quote(name,safe='')
            print('\nCARD',name,model,url)
            try:
              st,txt=get(url)
              clean=html.unescape(re.sub(r'\s+',' ',re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>|<[^>]+>',' ',txt,flags=re.I)))
              print(' status',st,'len',len(clean),'model_count',clean.count(model))
              idx=clean.find(model)
              if idx>=0: print(' SNIP',clean[max(0,idx-800):idx+1500])
            except Exception as e: print(' ERR',repr(e))
          PY
