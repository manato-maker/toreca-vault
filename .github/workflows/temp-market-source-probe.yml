name: Temporary Market Source Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-market-source-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe accessible alternate buyback sources
        shell: bash
        run: |
          python - <<'PY'
          import urllib.parse,urllib.request,re,html
          UA={'User-Agent':'Mozilla/5.0'}
          urls=[
            ('toresia-charizard','https://toresia.net/pokeca/cards/c01mxty','リザードン','137/103'),
            ('toresia-magikarp','https://toresia.net/pokeca/cards/c01ms6y','コイキング','165/103'),
            ('gamepedia-umbreon','https://premium.gamepedia.jp/pokeca/card/%E3%83%96%E3%83%A9%E3%83%83%E3%82%AD%E3%83%BCEX','ブラッキーex','044/040'),
            ('gamepedia-espeon','https://premium.gamepedia.jp/pokeca/card/%E3%82%A8%E3%83%BC%E3%83%95%E3%82%A3ex','エーフィex','043/040'),
          ]
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=30) as r:
              return r.status,r.read().decode('utf-8','replace')
          for label,url,name,model in urls:
            print('\nSRC',label,url)
            try:
              st,txt=get(url)
              clean=html.unescape(re.sub(r'\s+',' ',re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>|<[^>]+>',' ',txt,flags=re.I)))
              print(' status',st,'len',len(clean),'name?',name in clean,'model?',model in clean)
              idx=clean.find(model)
              if idx>=0: print(' SNIP',clean[max(0,idx-900):idx+1900])
            except Exception as e: print(' ERR',repr(e))
          PY
