name: Temporary Market Source Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-market-source-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Suruga and Toresia fallbacks
        shell: bash
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, re, html
          cards=[
            ('リザードン','M6a','137/103'),
            ('コイキング','M6a','165/103'),
            ('ブラッキーex','MF','044/040'),
            ('エーフィex','MF','043/040'),
          ]
          UA={'User-Agent':'Mozilla/5.0'}
          def get(url):
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=30) as r:
              return r.status,r.read().decode('utf-8','replace')
          for name,setcode,model in cards:
            print('\nCARD',name,setcode,model)
            for q in [name, model, name+' '+model]:
              try:
                url='https://www.suruga-ya.jp/kaitori/search_buy?'+urllib.parse.urlencode({'category':'','search_word':q})
                st,txt=get(url)
                clean=html.unescape(re.sub(r'\s+',' ',re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>|<[^>]+>',' ',txt,flags=re.I)))
                print(' SURUGA',q,'status',st,'len',len(clean),'model_count',clean.count(model),'name_count',clean.count(name))
                idx=clean.find(model)
                if idx>=0: print('  SNIP',clean[max(0,idx-450):idx+900])
              except Exception as e: print(' SURUGA_ERR',q,repr(e))
            try:
              url='https://toresia.net/pokeca/search?'+urllib.parse.urlencode({'q':model})
              st,txt=get(url)
              print(' TORESIA_SEARCH status',st,'len',len(txt),'model_count',txt.count(model))
              idx=txt.find(model)
              if idx>=0: print('  TORESIA_SNIP',re.sub(r'\s+',' ',txt[max(0,idx-500):idx+1200])[:1800])
            except Exception as e: print(' TORESIA_SEARCH_ERR',repr(e))
          PY
