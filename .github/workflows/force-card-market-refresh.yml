name: Temporary Force Card Market Refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-card-market-refresh.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    environment: v2-apps-script
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save @google/clasp
      - name: Configure clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          TV2_SCRIPT_ID: ${{ secrets.TV2_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$TV2_SCRIPT_ID"
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"automation"}' "$TV2_SCRIPT_ID" > .clasp.json
      - name: Force card market refresh
        run: npx clasp run runTv2ChatMarketRefresh --params '[{"requestId":"20261001-force-card-market-refresh-v6-direct"}]'
