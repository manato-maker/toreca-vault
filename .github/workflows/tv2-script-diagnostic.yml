name: V2 Apps Script read-only diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tv2-script-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: v2-apps-script
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @google/clasp
      - name: Configure existing private Apps Script credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          TV2_SCRIPT_ID: ${{ secrets.TV2_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$TV2_SCRIPT_ID"
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
          printf '{"scriptId":"%s"}' "$TV2_SCRIPT_ID" > .clasp.json
      - name: Identify OAuth client Cloud project without exposing credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node <<'NODE'
          const store = JSON.parse(process.env.CLASPRC_JSON);
          const saved = store.tokens?.default || store.token || {};
          const clientId = saved.client_id || store.oauth2ClientSettings?.clientId || '';
          const match = /^(\d+)-/.exec(String(clientId));
          if (!match) throw new Error('OAuth client project number unavailable; credential values were not emitted.');
          console.log('OAuth client Cloud project number: ' + match[1]);
          NODE
      - name: Read-only version and deployment inventory
        shell: bash
        run: |
          npx clasp list-versions --json > /tmp/tv2-versions.json
          npx clasp list-deployments --json > /tmp/tv2-deployments.json
          node <<'NODE'
          const fs = require('node:fs');
          const versions = JSON.parse(fs.readFileSync('/tmp/tv2-versions.json', 'utf8'));
          const deployments = JSON.parse(fs.readFileSync('/tmp/tv2-deployments.json', 'utf8'));
          if (!Array.isArray(versions) || !Array.isArray(deployments)) {
            throw new Error('Unexpected clasp listing shape; diagnosis stopped');
          }
          const activeVersions = [...new Set(deployments.map(d => Number(d.versionNumber)).filter(n => Number.isInteger(n) && n > 0))];
          const expected = deployments.filter(d => d.description === 'Toreca Vault V2 Automation API Executable');
          console.log('Apps Script saved version count: ' + versions.length + '/200');
          console.log('Active deployment count: ' + deployments.length);
          console.log('Distinct active version count: ' + activeVersions.length);
          console.log('Named private API deployment count: ' + expected.length);
          console.log('Private API deployment has version: ' + (expected.length === 1 && Number(expected[0].versionNumber) > 0));
          console.log('No script identifiers, deployment identifiers, or secret values are emitted.');
          if (versions.length >= 200) {
            console.log('Version ceiling reached: manual removal of unused script versions is required before a fresh release.');
          }
          NODE
      - name: Probe read-only trigger status and API completion
        env:
          TV2_SCRIPT_ID: ${{ secrets.TV2_SCRIPT_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const {GoogleAuth} = require('google-auth-library');
          const {google} = require('googleapis');
          const store = JSON.parse(fs.readFileSync(require('node:path').join(require('node:os').homedir(), '.clasprc.json'), 'utf8'));
          const saved = store.tokens?.default || (store.token ? {
            type: 'authorized_user',
            ...store.token,
            client_id: store.oauth2ClientSettings?.clientId,
            client_secret: store.oauth2ClientSettings?.clientSecret,
          } : null);
          if (!saved?.refresh_token && !saved?.access_token) {
            console.log('Read-only API probe stopped: saved OAuth credential format unavailable.');
            process.exit(1);
          }
          const auth = new GoogleAuth().fromJSON(saved);
          const api = google.script({version: 'v1', auth});
          const classify = value => /permission|authoriz|not_authorized/i.test(value) ? 'authorization'
            : /not found|not_found/i.test(value) ? 'not_found'
            : value ? 'other_error' : 'none';
          (async () => {
            try {
              const {data} = await api.scripts.run({
                scriptId: process.env.TV2_SCRIPT_ID,
                requestBody: {function: 'tv2AutomationStatus', parameters: [], devMode: false},
              });
              const result = data?.response?.result;
              const apiMessage = String(data?.error?.message || '');
              const executionMessage = String(data?.error?.details?.[0]?.errorMessage || '');
              console.log(JSON.stringify({
                done: data?.done === true,
                apiErrorCode: data?.error?.code ?? null,
                apiErrorClass: classify(apiMessage),
                executionErrorClass: classify(executionMessage),
                hasResponse: Boolean(data?.response),
                resultType: result === null ? 'null' : typeof result,
                resultOk: result?.ok === true,
              }));
              if (data?.done !== true || data?.error || result?.ok !== true) process.exitCode = 1;
            } catch (error) {
              const status = Number(error?.code || error?.response?.status || 0) || null;
              const message = String(error?.message || '');
              console.log(JSON.stringify({
                done: false,
                apiErrorCode: status,
                apiErrorClass: classify(message),
                executionErrorClass: 'none',
                hasResponse: false,
                resultType: 'undefined',
                resultOk: false,
              }));
              process.exitCode = 1;
            }
          })();
          NODE
