name: Temporary Market Source Probe
on:
  push:
    branches: [main]
    paths:
      - 'scripts/market-source-probe.mjs'
      - '.github/workflows/market-source-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/market-source-probe.mjs
