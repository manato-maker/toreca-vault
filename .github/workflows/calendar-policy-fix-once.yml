name: Apply calendar policy fix once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calendar-policy-fix-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch calendar policy
        run: python tools/calendar_policy_fix.py
      - run: npm test
      - run: npm run check
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js sw.js test/calendar-policy-source.test.js
          git commit -m "Fix lottery calendar result scheduling"
          git push origin HEAD:main
