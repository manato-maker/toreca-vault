name: Card Market Diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cardrush-diagnostic.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test Toretoku keyword search
        shell: bash
        run: |
          python - <<'PY'
          import urllib.parse,urllib.request,re,json
          for q in ['メガレックウザex','M6 095/076','メガレックウザex M6 095/076']:
            url='https://www.toretoku.jp/kaitori/pokemon/item-search?'+urllib.parse.urlencode({'genre':'pokemon','keyword':q})
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
            print('QUERY',q,'LEN',len(text),'RAY',text.count('メガレックウザex'),'MODEL',text.count('095/076'))
            m=re.search(r'\"items\":\[(.*?)\],\"',text,re.S)
            if m:
              chunk=m.group(1)
              print('ITEMS_CHUNK',re.sub(r'\\u[0-9a-fA-F]{4}','?',chunk[:1200]))
            for mm in re.finditer('095/076',text):
              s=re.sub(r'\s+',' ',text[max(0,mm.start()-550):mm.start()+850])
              print('SNIP',s[:1400]);break
          PY
