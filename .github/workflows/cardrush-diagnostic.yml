name: Card Market Diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cardrush-diagnostic.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Toretoku search markup
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,re
          url='https://www.toretoku.jp/kaitori/pokemon/item-search?category=3926'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
          print('LEN',len(text))
          for pat in [r'<form[^>]*>[\s\S]{0,4000}?</form>',r'<input[^>]+>',r'<select[^>]+>']:
            ms=re.findall(pat,text,re.I)
            print('PAT',pat,'COUNT',len(ms))
            for s in ms[:20]:
              s=re.sub(r'\s+',' ',s)
              if 'search' in s.lower() or 'keyword' in s.lower() or 'name=' in s.lower() or 'category' in s.lower():
                print('SNIP',s[:1500])
          for needle in ['item-search','keyword','search_word','word','query','メガレックウザex','095/076']:
            print('NEEDLE',needle,'COUNT',text.count(needle))
          for m in re.finditer('メガレックウザex',text):
            s=re.sub(r'\s+',' ',text[max(0,m.start()-500):m.start()+1800])
            print('CARD',s[:2200])
            break
          PY
