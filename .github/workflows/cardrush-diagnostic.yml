name: Cardrush Diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cardrush-diagnostic.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact Cardrush buyback markup
        shell: bash
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, re
          name='メガレックウザex'
          params={
            'displayMode':'リスト','limit':'100','name':name,'rarity':'',
            'model_number':'095/076','amount':'','page':'1',
            'sort[key]':'amount','sort[order]':'desc'
          }
          for label,extra in [('model',params),('name-only',{**params,'model_number':''})]:
            url='https://cardrush.media/pokemon/buying_prices?'+urllib.parse.urlencode(extra)
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            try:
              text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              print('MODE',label,'LEN',len(text),'STATUS ok')
              for needle in ['095/076','メガレックウザex','2,000','2000']:
                print('NEEDLE',needle,'COUNT',text.count(needle))
              m=re.search(r'.{0,500}095/076.{0,1000}',text,re.S)
              if m:
                s=re.sub(r'\s+',' ',m.group(0))
                print('SNIP',s[:1800])
            except Exception as e:
              print('MODE',label,'ERR',type(e).__name__,str(e))
          PY
