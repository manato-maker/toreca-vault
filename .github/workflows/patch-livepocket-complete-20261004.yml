name: Patch LivePocket Complete Automation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-livepocket-complete-20261004.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch LivePocket ingestion and regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          code_path=Path('automation/Code.gs')
          code=code_path.read_text()

          old_store="""  let store = extractLineValue_(text, /^(?:会場|店舗名|受取店舗|受取登録店舗)\\s*[:：は]*\\s*[「『]?/m).replace(/[」』]$/,'').trim();"""
          new_store="""  let store = isLivePocket ? extractLivePocketStore_(text) : extractLineValue_(text, /^(?:会場|店舗名|受取店舗|受取登録店舗)\\s*[:：は]*\\s*[「『]?/m).replace(/[」』]$/,'').trim();"""
          assert old_store in code, 'store extraction anchor missing'
          code=code.replace(old_store,new_store,1)

          old_existing="""  const existing=lotteries.find(x => String(x.id || '').includes(applicationNo) || String(x.memo || '').includes(applicationNo));
  if(existing){
    const before=JSON.stringify(existing);
    if(isLivePocket||isPokemonCenter||isYamada){
      existing.title=isYamada?String(title).trim():cleanLotteryTitle_(title);
      existing.store=cleanStoreName_(store);
      existing.gmailMessageId=message.getId();
      existing.updatedAt=now.toISOString();
    }
    return {kind:JSON.stringify(existing)===before?'duplicate':'updated',item:existing};
  }

  const resultDate = contextualDate_(text, /(当選発表予定日|当選発表|当選者の発表|結果発表|当選メール)/);"""
          new_existing="""  const resultDate = contextualDate_(text, /(当選発表予定日|当選発表|当選者の発表|結果発表|当選メール)/);
  const existing=lotteries.find(x => String(x.id || '').includes(applicationNo) || String(x.memo || '').includes(applicationNo));
  if(existing){
    const before=JSON.stringify(existing);
    if(isLivePocket||isPokemonCenter||isYamada){
      existing.title=isYamada?String(title).trim():cleanLotteryTitle_(title);
      existing.store=cleanStoreName_(store);
      existing.gmailMessageId=message.getId();
      existing.updatedAt=now.toISOString();
    }
    // Official application mail is authoritative for its announced result date.
    // Backfill older/manual records as well as parser-created records.
    if(resultDate)existing.resultDate=resultDate;
    if(applicationNo&&!String(existing.memo||'').includes(applicationNo))existing.memo=[existing.memo,'申込番号 '+applicationNo].filter(Boolean).join('｜');
    return {kind:JSON.stringify(existing)===before?'duplicate':'updated',item:existing};
  }"""
          assert old_existing in code, 'existing application anchor missing'
          code=code.replace(old_existing,new_existing,1)

          start=code.index('function extractLivePocketTitle_(text){')
          end=code.index('function applyLivePocketMetadata_(item,text,message,now){',start)
          assert start>=0 and end>start, 'LivePocket helper block missing'
          helper_block=r'''function extractLivePocketZeroTicket_(text){
  const src=String(text||'');
  const line=src.split(/\r?\n/).map(x=>x.trim()).find(x=>
    /[：:]\s*[¥￥]\s*0(?:\s|$)/.test(x)&&!/(チケット料金|システム利用料|合計金額)/.test(x)
  );
  return line?line.replace(/[：:]\s*[¥￥]\s*0.*$/,'').trim():'';
}

function livePocketLooksLikeProductText_(value){
  return /(ポケモン|ポケカ|ONE ?PIECE|ワンピース|ドラゴンボール|30th|CELEBRATION|ストームエメラルダ|インフェルノX|BOX|ボックス|パック|デッキ|カードセット|購入権)/i.test(String(value||''));
}

function livePocketLooksLikeStoreText_(value){
  const s=String(value||'').trim();
  return !!s&&!livePocketLooksLikeProductText_(s)&&/(本店|支店|店|GAMESHOP|ショップ|書店|センター|館)/i.test(s);
}

function extractLivePocketStore_(text){
  const selected=extractLivePocketZeroTicket_(text);
  if(selected&&livePocketLooksLikeStoreText_(selected))return cleanStoreName_(selected);
  const venue=extractLineValue_(text,/^(?:会場|店舗名)\s*[:：]\s*/m);
  return cleanStoreName_(venue);
}

function extractLivePocketTitle_(text){
  const src=String(text||'');
  const ticket=extractLineValue_(src,/^チケット名\s*[:：]/m);
  if(ticket&&livePocketLooksLikeProductText_(ticket))return cleanLivePocketProductText_(ticket);

  const priced=extractLivePocketZeroTicket_(src);
  if(priced&&livePocketLooksLikeProductText_(priced)){
    const cleaned=cleanLivePocketProductText_(priced);
    if(cleaned)return cleaned;
  }

  const event=extractLineValue_(src,/^イベント名\s*[:：]/m);
  if(event){
    const cleaned=cleanLivePocketProductText_(event);
    if(cleaned)return cleaned;
  }

  const reception=extractLineValue_(src,/^販売受付名\s*[:：]/m);
  if(reception&&!/^(?:抽選販売受付|抽選受付|販売受付)$/.test(reception.trim())){
    const cleaned=cleanLivePocketProductText_(reception);
    if(cleaned)return cleaned;
  }
  return'';
}

function cleanLivePocketProductText_(value){
  let s=String(value||'').normalize('NFKC').trim();
  s=s.replace(/^【[^】]+】\s*/,'').trim();
  const quoted=[...s.matchAll(/「([^」]+)」/g)];
  if(quoted.length){
    const inner=String(quoted[quoted.length-1][1]||'').trim();
    if(inner&&livePocketLooksLikeProductText_(inner))s=inner;
  }
  const parens=[...s.matchAll(/[（(]([^（）()]+)[）)]/g)];
  if(parens.length){
    const inner=String(parens[parens.length-1][1]||'').trim();
    if(inner&&!/^(?:大阪府|奈良県|京都府|兵庫県|東京都|神奈川県|愛知県|その他)$/.test(inner)&&livePocketLooksLikeProductText_(inner))s=inner;
  }
  s=s.replace(/^(?:ポケカ|ポケモンカード(?:ゲーム)?)?\s*抽選\s*販売\s*/,'')
     .replace(/^抽選販売\s*/,'')
     .replace(/^販売受付\s*/,'')
     .replace(/^ポケモンカードゲーム\s*MEGA\s*拡張パック\s*/i,'')
     .replace(/^ポケモンカードゲーム\s*MEGA\s*/i,'')
     .replace(/^ポケモンカードゲーム\s*/i,'')
     .trim();
  return cleanLotteryTitle_(s);
}

'''
          code=code[:start]+helper_block+code[end:]

          old_apply="""  const store=extractLineValue_(text,/^(?:会場|店舗名)\\s*[:：]\\s*/m);"""
          new_apply="""  const store=extractLivePocketStore_(text);"""
          assert old_apply in code, 'LivePocket metadata store anchor missing'
          code=code.replace(old_apply,new_apply,1)
          code_path.write_text(code)

          v2_path=Path('automation/V2Automation.gs')
          v2=v2_path.read_text()
          assert "const parserVersion='gmail-efficient-v7'" in v2
          v2=v2.replace("const parserVersion='gmail-efficient-v7'","const parserVersion='gmail-efficient-v8-livepocket-complete'",1)
          assert "parserChanged?new Date(now.getTime()-7*86400000)" in v2
          v2=v2.replace("parserChanged?new Date(now.getTime()-7*86400000)","parserChanged?new Date(now.getTime()-30*86400000)",1)
          old_query=": after+' {抽選 当選 落選 応募 申込}',threads=[];"
          new_query=": after+' {from:noreply@livepocket.jp 抽選 当選 落選 応募 申込}',threads=[];"
          assert old_query in v2, 'normal Gmail query anchor missing'
          v2=v2.replace(old_query,new_query,1)
          v2_path.write_text(v2)

          test_path=Path('test/livepocket-complete-import.test.js')
          test_path.write_text(r'''import test from'node:test';import assert from'node:assert/strict';import fs from'node:fs';import vm from'node:vm';
const code=fs.readFileSync(new URL('../automation/Code.gs',import.meta.url),'utf8');
const start=code.indexOf('function upsertApplication_('),end=code.indexOf('function sendReport_(',start);
const context=vm.createContext({Utilities:{formatDate:()=> '2026'}});
vm.runInContext(code.slice(start,end),context);
const msg=(id='m1')=>({getId:()=>id,getFrom:()=>'noreply@livepocket.jp',getSubject:()=>'[LivePocket]抽選申込完了のお知らせ'});

test('Yellow Submarine LivePocket application imports announced result date',()=>{
 const body=`イベント名：落選者専用：10月再販ポケモンカードゲーム「30th CELEBRATION」購入権抽選\n会場：イエローサブマリン（その他）\n販売受付名：落選者専用　10月再販：30th CELEBRATION購入権抽選受付\n申込番号：1054301100\n落選者専用：10月再販「30th CELEBRATION」購入権：¥0\n当選発表予定日：10月10日`;
 const rows=[];const r=context.upsertApplication_(rows,body,msg('ys'),new Date('2026-10-04T00:00:00Z'));
 assert.equal(r.kind,'created');
 assert.equal(rows[0].resultDate,'2026-10-10');
 assert.match(rows[0].title,/30th CELEBRATION/);
 assert.equal(rows[0].store,'イエローサブマリン');
});

test('LivePocket application backfills result date on an existing application number',()=>{
 const body=`イベント名：落選者専用：10月再販ポケモンカードゲーム「30th CELEBRATION」購入権抽選\n会場：イエローサブマリン（その他）\n申込番号：1054301100\n落選者専用：10月再販「30th CELEBRATION」購入権：¥0\n当選発表予定日：10月10日`;
 const rows=[{id:'lottery-livepocket-1054301100',title:'30th CELEBRATION',store:'イエローサブマリン',status:'応募済',resultDate:'',memo:'自動登録｜申込番号 1054301100'}];
 const r=context.upsertApplication_(rows,body,msg('ys2'),new Date('2026-10-04T00:00:00Z'));
 assert.equal(r.kind,'updated');assert.equal(rows[0].resultDate,'2026-10-10');
});

test('Hobby Station LivePocket uses selected shop ticket as store, not as product',()=>{
 const body=`イベント名：ホビーステーション「ポケモンカードゲームMEGA 拡張パック 30th CELEBRATION（再販）」抽選販売\n会場：ホビーステーション（全国各地）\n販売受付名：「30th CELEBRATION再販）」抽選受付（関東以外）\n申込番号：1053491691\n日本橋2's店：¥0\n当選発表予定日：2026年10月9日(金)`;
 const rows=[];const r=context.upsertApplication_(rows,body,msg('hs'),new Date('2026-10-02T00:00:00Z'));
 assert.equal(r.kind,'created');assert.equal(rows[0].resultDate,'2026-10-09');assert.equal(rows[0].store,"日本橋2's店");assert.match(rows[0].title,/30th CELEBRATION/);
});

test('scheduled Gmail query always includes LivePocket sender and parser upgrade replays 30 days',()=>{
 const src=fs.readFileSync(new URL('../automation/V2Automation.gs',import.meta.url),'utf8');
 assert.match(src,/gmail-efficient-v8-livepocket-complete/);
 assert.match(src,/parserChanged\?new Date\(now\.getTime\(\)-30\*86400000\)/);
 assert.match(src,/after\+' \{from:noreply@livepocket\.jp 抽選 当選 落選 応募 申込\}'/);
});
''')
          PY
      - name: Run tests
        run: npm test
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-livepocket-complete-20261004.yml
          git config user.name 'manato-maker'
          git config user.email 'manato.pt@gmail.com'
          git add automation/Code.gs automation/V2Automation.gs test/livepocket-complete-import.test.js .github/workflows/patch-livepocket-complete-20261004.yml
          git commit -m 'Make LivePocket lottery sync complete and self-healing'
          git push origin main
