name: Patch LivePocket Complete Automation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-livepocket-complete-20261004.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch LivePocket ingestion and regression tests
        run: python3 -c "import gzip,base64;exec(gzip.decompress(base64.b64decode('')).decode())"
      - name: Run tests
        run: npm test
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-livepocket-complete-20261004.yml
          git config user.name 'manato-maker'
          git config user.email 'manato.pt@gmail.com'
          git add automation/Code.gs automation/V2Automation.gs test/livepocket-complete-import.test.js .github/workflows/patch-livepocket-complete-20261004.yml
          git commit -m 'Make LivePocket lottery sync complete and self-healing'
          git push origin main
