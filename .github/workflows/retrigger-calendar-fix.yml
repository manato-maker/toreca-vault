name: Retrigger calendar fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retrigger-calendar-fix.yml'
permissions:
  contents: write
jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch calendar fix workflow
        run: |
          printf '\n# retry after calendar source test migration\n' >> .github/workflows/calendar-policy-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/calendar-policy-fix-once.yml
          git commit -m "Retry calendar policy fix"
          git push origin HEAD:main
