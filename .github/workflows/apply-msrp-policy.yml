          npm run check
      - name: Commit policy
        run: |
          git config user.name 'manato-maker'
          git config user.email 'manato.pt@gmail.com'
          git add v2/retail-price.js v2/ui-entry.js v2/lottery-write.js automation/RetailPricePolicy.gs automation/V2Automation.gs .github/workflows/apps-script-deploy.yml js/app.js package.json sw.js test/retail-price-policy.test.js
          git commit -m 'Use fixed MSRP for non-single purchases and cost basis'
          git push origin main
