# retry after MSRP regression alignment
name: Apply MSRP accounting policy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-msrp-policy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch runtime entry points
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('v2/lottery-write.js');s=p.read_text()
          if "from'./retail-price.js'" not in s:s=s.replace("import{validateState,applyTransaction}from'./core.js';","import{validateState,applyTransaction}from'./core.js';\nimport{retailPriceInfo}from'./retail-price.js';",1)
          old="const receivedDate=text(data.receivedDate),product=text(data.product||item.title),store=text(data.store||item.store),category=text(data.category||'BOX'),quantity=Number(data.quantity||1),total=Number(data.total||0),addPurchase=data.addPurchase!==false;"
          new="const receivedDate=text(data.receivedDate),product=text(data.product||item.title),store=text(data.store||item.store),category=text(data.category||'BOX'),quantity=Number(data.quantity||1),enteredTotal=Number(data.total||0),addPurchase=data.addPurchase!==false;"
          if old in s:s=s.replace(old,new,1)
          old=" if(addPurchase&&(!Number.isFinite(total)||total<=0))throw new Error('購入合計金額を入力してください');"
          new=" const retail=category==='カード'?null:retailPriceInfo(product,category),accountingTotal=retail?retail.price*quantity:enteredTotal;\n if(addPurchase&&category==='カード'&&(!Number.isFinite(enteredTotal)||enteredTotal<=0))throw new Error('購入合計金額を入力してください');\n if(addPurchase&&category!=='カード'&&!retail)throw new Error('定価未登録の商品です。公式価格を確認して定価マスターへ追加してください');"
          if old in s:s=s.replace(old,new,1)
          old=" item.receiptAmount=Number.isFinite(total)&&total>0?total:item.receiptAmount;"
          new=" if(Number.isFinite(enteredTotal)&&enteredTotal>=0)item.receiptPaidAmount=enteredTotal;item.receiptAmount=retail?accountingTotal:(Number.isFinite(enteredTotal)&&enteredTotal>0?enteredTotal:item.receiptAmount);if(retail){item.receiptPriceBasis='希望小売価格';item.retailPriceSource=retail.source;}"
          if old in s:s=s.replace(old,new,1)
          old="  const price=total/quantity,existing=next.transactions.find(x=>x.id===txId);"
          new="  const price=accountingTotal/quantity,existing=next.transactions.find(x=>x.id===txId);"
          if old in s:s=s.replace(old,new,1)
          old="   const tx={id:txId,type:'purchase',product,productKey:product,store,date:receivedDate,quantity,price,total,category,condition:receiptCondition(category,data.shrinkStatus),sourceLotteryId:id,memo:'抽選受取｜レシート確認'};"
          new="   const tx={id:txId,type:'purchase',product,productKey:product,store,date:receivedDate,quantity,price,total:accountingTotal,category,condition:receiptCondition(category,data.shrinkStatus),sourceLotteryId:id,memo:'抽選受取｜レシート確認'};if(retail){tx.priceBasis='希望小売価格';tx.retailPriceSource=retail.source;if(Number.isFinite(enteredTotal)&&enteredTotal>=0&&enteredTotal!==accountingTotal){tx.actualPaid=enteredTotal/quantity;tx.actualPaidTotal=enteredTotal;}}"
          if old in s:s=s.replace(old,new,1)
          if 'enteredTotal' not in s or 'retailPriceInfo(product,category)' not in s:raise SystemExit('lottery receipt MSRP patch failed')
          p.write_text(s)

          p=Path('automation/V2Automation.gs');s=p.read_text()
          old="  const gmail=runTv2LotteryAuto({skipScheduleEnsure:true});"
          new="  const retail=typeof tv2EnforceRetailPricePolicy_==='function'?tv2EnforceRetailPricePolicy_():{skipped:true,reason:'retail-policy-unavailable'};\n  const gmail=runTv2LotteryAuto({skipScheduleEnsure:true});"
          if old in s:s=s.replace(old,new,1)
          old="  return{ok:true,gmail,market};"
          new="  return{ok:true,retail,gmail,market};"
          if old in s:s=s.replace(old,new,1)
          s=s.replace("if(/スタートデッキ|デッキセット|構築済みデッキ/.test(name))return'BOX';","if(/スタートデッキ|デッキセット|構築済みデッキ|カードセット/.test(name))return'BOX';",1)
          old=" const quantity=Number(input.quantity),unitCost=Number(input.unitCost),requestId=String(input.requestId||'').trim();"
          new=" const quantity=Number(input.quantity),enteredUnitCost=Number(input.unitCost!==undefined?input.unitCost:input.price),requestId=String(input.requestId||'').trim();\n const retailInfo=category==='カード'?null:tv2RetailPriceInfo_(product,category),unitCost=retailInfo?retailInfo.price:enteredUnitCost;"
          if old in s:s=s.replace(old,new,1)
          old=" if(!product||!requestId||!/^\\d{4}-\\d{2}-\\d{2}$/.test(date)||!Number.isInteger(quantity)||quantity<=0||!Number.isFinite(unitCost)||unitCost<0)throw new Error('チャット購入データが不正です');"
          new=" if(!product||!requestId||!/^\\d{4}-\\d{2}-\\d{2}$/.test(date)||!Number.isInteger(quantity)||quantity<=0)throw new Error('チャット購入データが不正です');\n if(category==='カード'&&(!Number.isFinite(unitCost)||unitCost<0))throw new Error('チャット購入データが不正です');\n if(category!=='カード'&&!retailInfo)throw new Error('定価未登録の商品です。公式価格を確認して定価マスターへ追加してください');"
          if old in s:s=s.replace(old,new,1)
          old="  state.inventoryLots.push({id:lotId,product,productKey:product,category,condition,set:category==='カード'?cardSet:'',quantity,unitCost,acquiredAt:date,store,source,requestId,memo});\n  state.transactions.push({id:txId,type:'purchase',product,productKey:product,category,condition,set:category==='カード'?cardSet:'',quantity,price:unitCost,total:unitCost*quantity,date,store,source,requestId,memo});"
          new="  const lot={id:lotId,product,productKey:product,category,condition,set:category==='カード'?cardSet:'',quantity,unitCost,acquiredAt:date,store,source,requestId,memo};if(retailInfo){lot.priceBasis='希望小売価格';lot.retailPriceSource=retailInfo.source;}state.inventoryLots.push(lot);\n  const tx={id:txId,type:'purchase',product,productKey:product,category,condition,set:category==='カード'?cardSet:'',quantity,price:unitCost,total:unitCost*quantity,date,store,source,requestId,memo};if(retailInfo){tx.priceBasis='希望小売価格';tx.retailPriceSource=retailInfo.source;if(Number.isFinite(enteredUnitCost)&&enteredUnitCost>=0&&enteredUnitCost!==unitCost){tx.actualPaid=enteredUnitCost;tx.actualPaidTotal=enteredUnitCost*quantity}}state.transactions.push(tx);"
          if old in s:s=s.replace(old,new,1)
          if 'tv2EnforceRetailPricePolicy_' not in s or 'retailInfo=category' not in s:raise SystemExit('Apps Script MSRP patch failed')
          p.write_text(s)

          p=Path('js/app.js');s=p.read_text()
          old="function saleCostStatusText(x){if(x?._kind!=='売却')return'';if(x.acquisitionCost==null)return'原価未確定（損益・回収率から除外）';const cost=Number(x.acquisitionCost)||0,profit=saleRevenue(x)-cost;return`原価 ${yen.format(cost)} · 損益 ${profit>=0?'+':''}${yen.format(profit)}`}"
          new="function saleCostStatusText(x){if(x?._kind!=='売却')return'';if(x.acquisitionCost==null)return'原価未確定（損益・回収率から除外）';const cost=Number(x.acquisitionCost)||0,profit=saleRevenue(x)-cost,basis=x.acquisitionCostBasis==='希望小売価格'?'原価（定価）':'原価';return`${basis} ${yen.format(cost)} · 損益 ${profit>=0?'+':''}${yen.format(profit)}`}"
          if old in s:s=s.replace(old,new,1)
          if '原価（定価）' not in s:raise SystemExit('ledger MSRP label patch failed')
          p.write_text(s)
          PY
      - name: Test
        run: |
          npm test
          npm run check
      - name: Commit runtime policy
        run: |
          git config user.name 'manato-maker'
          git config user.email 'manato.pt@gmail.com'
          git add v2/lottery-write.js automation/V2Automation.gs js/app.js
          git commit -m 'Enforce fixed MSRP across V2 purchase paths'
          git push origin main
