<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09111b">
  <meta name="description" content="Toreca Vault 資産ダッシュボード">
  <title>Toreca Vault</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="today"></p>
        <h1>Toreca Vault</h1>
      </div>
      <button id="refresh" class="icon-button" aria-label="更新" title="更新">↻</button>
    </header>

    <section id="login" class="login-card">
      <div class="brand-mark">TV</div>
      <h2>資産ダッシュボード</h2>
      <p>Googleアカウントでログインすると、最新のstaging在庫を確認できます。</p>
      <div id="google-signin"></div>
      <p id="login-message" class="subtle">在庫データはログインした本人だけに表示されます。</p>
    </section>

    <section id="dashboard" hidden>
      <div id="status" class="status-line" role="status"></div>
      <section class="hero-card">
        <span class="label">推定総資産</span>
        <strong id="total-assets" class="hero-value">—</strong>
        <span id="asset-difference" class="delta"></span>
      </section>
      <section class="hero-card profit-card">
        <span class="label">実現損益</span>
        <strong id="realized-profit" class="hero-value">—</strong>
        <span class="delta">売却済みのみ</span>
      </section>
      <div class="metric-grid">
        <article class="metric-card"><span>現在庫取得原価</span><strong id="inventory-cost">—</strong></article>
        <article class="metric-card"><span>カード推定資産</span><strong id="cards-value">—</strong></article>
        <article class="metric-card"><span>BOX推定資産</span><strong id="boxes-value">—</strong></article>
        <article class="metric-card"><span>バラパック推定資産</span><strong id="packs-value">—</strong></article>
        <article class="metric-card"><span>累計購入額</span><strong id="purchases-total">—</strong></article>
        <article class="metric-card"><span>売却累計</span><strong id="sales-total">—</strong></article>
      </div>

      <section id="inventory-section" class="inventory-section">
        <div class="section-heading">
          <div><p class="eyebrow">CURRENT STOCK</p><h2>在庫</h2></div>
          <span id="stock-count" class="stock-count"></span>
        </div>
        <div class="filters" role="group" aria-label="在庫種別">
          <button class="filter active" data-filter="all">すべて</button>
          <button class="filter" data-filter="BOX">BOX</button>
          <button class="filter" data-filter="カード">カード</button>
          <button class="filter" data-filter="パック">パック</button>
        </div>
        <div id="inventory-list" class="inventory-list"></div>
      </section>
      <section id="activity-section" class="inventory-section" hidden>
        <div class="section-heading">
          <div><p class="eyebrow">RECENT ACTIVITY</p><h2>履歴</h2></div>
        </div>
        <div id="activity-list" class="inventory-list"></div>
      </section>
      <p class="read-only-note">読み取り専用 · staging data · revision <span id="revision"></span></p>
    </section>
  </main>

  <nav id="bottom-nav" class="bottom-nav" aria-label="メインメニュー" hidden>
    <button class="nav-item active" data-view="assets"><span>⌂</span>資産</button>
    <button class="nav-item" data-view="inventory"><span>□</span>在庫</button>
    <button class="nav-item" data-view="income"><span>¥</span>収支</button>
    <button class="nav-item" data-view="activity"><span>↗</span>履歴</button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app-config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
